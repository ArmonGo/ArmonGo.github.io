---
layout: default
title: Home
---

{% assign posts_by_sequence = site.posts | sort: "slug" %}

<section class="posts">
  {% for post in posts_by_sequence %}
  <a href="{{ post.url }}" class="post-link">
    <div class="post {% if forloop.index > 1 %}bg-white shadow{% endif %}">
      <img class="image" src="{{ post.image.feature | prepend: site.baseurl_hero }}" alt="{{ post.title }}">
      <h2 class="title {% if forloop.index == 1 %}hide-title{% endif %}">{{ post.title }}</h2>
    </div>
  </a>
  {% endfor %}
</section>
